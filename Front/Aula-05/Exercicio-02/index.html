<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Labirinto Hardcore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Chegue ao verde sem tocar nas paredes ou inimigos.</h2>

<div id="timer"></div>

<div class="labirinto" id="labirinto">

    <div class="player" id="player"></div>

    <!-- PAREDES EXTERNAS -->
    <div class="parede" style="top:0; left:0; width:700px; height:20px;"></div>
    <div class="parede" style="top:0; left:0; width:20px; height:500px;"></div>
    <div class="parede" style="top:480px; left:0; width:700px; height:20px;"></div>
    <div class="parede" style="top:0; left:680px; width:20px; height:500px;"></div>

    <!-- CORREDORES -->
    <div class="parede" style="top:100px; left:20px; width:500px; height:20px;"></div>

    <!-- 🔥 ESSA É A PAREDE SECRETA -->
    <div class="parede segredo" style="top:200px; left:180px; width:500px; height:20px;"></div>

    <div class="parede" style="top:300px; left:20px; width:500px; height:20px;"></div>
    <div class="parede" style="top:400px; left:180px; width:500px; height:20px;"></div>

    <!-- FINAL -->
    <div class="final" style="top:430px; left:630px;"></div>

    <!-- INIMIGOS -->
    <div class="enemy"></div>
    <div class="enemy"></div>

</div>

<!-- JUMPSCARE -->
<div id="jumpscare" class="jumpscare">
    <img src="susto.gif">
    <audio src="susto.mp3" id="sustoMp3"></audio>
</div>

<!-- SALA SECRETA -->
<div id="salaSecreta" class="salaSecreta">
    <h1>VOCÊ DESCOBRIU O SEGREDO</h1>
    <img src="passaro-explodindo.gif" alt="Segredo">
    <audio id="audioExplosao" src="passaro-explodindo.mp3"></audio>
    <p style="margin-top: 20px; color: #555;">Pressione F5 para voltar</p>
</div>

<script src="script.js"></script>
</body>
</html>
