<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Prática de Validação JS</title>
</head>
<style>
    body{
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1{
    margin-top: 30px;
    color: #333;
}

p{
    color: #555;
}

form{
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
}

label{
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

input{
    width: 100%;
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.2s;
}

input:focus{
    border-color: #007bff;
    outline: none;
    box-shadow: 0 0 5px rgba(0,123,255,0.4);
}

span{
    color: red;
    font-size: 12px;
    display: block;
    margin-bottom: 10px;
}

button{
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
    margin-right: 10px;
}

button[type="submit"]{
    background: #28a745;
    color: white;
}

button[type="submit"]:hover{
    background: #218838;
}

button[type="reset"]{
    background: #dc3545;
    color: white;
}

button[type="reset"]:hover{
    background: #c82333;
}

#resultado{
    margin-top: 30px;
    width: 400px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
}

hr{
    width: 420px;
    margin-top: 30px;
}
</style>

<body>
    <h1>Formulário de Cadastro</h1>
    <p>Preencha todos os campos e clique em Enviar.</p>
    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Ana Carolina">
        <span id="erro-nome"></span>

    <br>
    <br>

        <label for="email">E-mail:</label>
        <input type="text" id="email" name="email" placeholder="Ex: anacarolina@email.com">
        <span id="erro-email"></span>

    <br>
    <br>
        
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres">
        
    <br>

        <label for="confirma-senha">Confirmar senha:</label>
        <input type="password" id="confirma-senha" name="confirma-senha" placeholder="Repita a senha">
        <span id="erro-senha"></span>

    <br>
    <br>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Ex: 000.000.000-00" maxlength="14">
        <span id="erro-cpf"></span>

    <br>
    <br>

        <label for="telefone">Telefone:</label>
        <input type="number" id="telefone" name="telefone" placeholder="Ex: (11) 99999-9999" maxlength="15">
        <span id="erro-telefone"></span>

    <br>
    <br>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep" placeholder="Ex: 01310-100" maxlength="9">
        <span id="erro-cep"></span>

    <br>
    <br>

        <label for="data-nascimento">Data:</label>
        <input type="text" id="data-nascimento" name="data-nascimento" placeholder="Ex: 31/12/1990" maxlength="10">
        <span id="erro-data-nascimento"></span>

    <br>
    <br>

        <label for="valor">Valor:</label>
        <input type="text" id="valor" name="valor" placeholder="Ex: 1.299,90">
        <span id="erro-valor"></span>

    <br>
    <br>

        <label for="url">URL:</label>
        <input type="text" id="url" name="url" placeholder="Ex: https://meusite.com.br">
        <span id="erro-url"></span>

    <br>
    <br>

        <label for="cartao">Número do cartão:</label>
        <input type="text" id="cartao" name="cartao" placeholder="Ex: 4111 1111 1111 1111" maxlength="19">
        <span id="erro-cartao"></span>

    <br>
    <br>

        <button type="submit" >Enviar</button>
        <button type="reset">Limpar</button>
    </form>
    <hr>
    <div id="resultado"></div>
</body>

<script src="script.js"></script>

</html>
