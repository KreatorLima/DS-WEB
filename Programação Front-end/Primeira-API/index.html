<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Primeira API</title>
</head>

<body>

    <div class="container">
        <h3>Testando requisições HTTP para a minha primeira API</h3>
        <hr>

        <h4>Endpoint ➡️ /localhost/Primeira-API/hello</h4> <br>
        <h4>Método 📎 GET</h4> <br>
        <button id="botaoHello">Enviar</button> 
        <hr>

        <h4>Endpoint ➡️ /localhost/Primeira-API/echo</h4> <br>
        <h4>Método 🔅 POST</h4> <br>
        <input type="text" id="inputEcho"> <br><br>
        <button id="botaoEcho">Enviar</button>

        <hr>

        <h4>Resposta da aquisição: </h4>
        <div id="resposta"></div>


    </div>

</body>

<script src="script.js"></script>

</html>
